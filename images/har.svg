<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFF7ED;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FDE68A;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background Aura/Glow -->
  <circle cx="250" cy="250" r="220" fill="url(#glow)" />
  
  <!-- Decorative Rays -->
  <g stroke="#F97316" stroke-width="3" stroke-linecap="round" opacity="0.4">
    <line x1="250" y1="80" x2="250" y2="40" />
    <line x1="250" y1="420" x2="250" y2="460" />
    <line x1="80" y1="250" x2="40" y2="250" />
    <line x1="420" y1="250" x2="460" y2="250" />
  </g>

  <!-- Text 'Har' in Center -->
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-size="150" font-weight="bold" fill="#D97706" style="text-shadow: 0 4px 12px rgba(249,115,22,0.3);">
    ਹਰਿ
  </text>
</svg>